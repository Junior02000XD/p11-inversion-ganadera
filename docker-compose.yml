# Entorno local del Proyecto 11: bandeja de correo de prueba.
# La base de datos es SQL Server en localhost:1433 (contenedor aparte, ver apps/api/README.md).
#   docker compose up -d        → levanta Mailpit
#   http://localhost:8025        → correos que envía la API (OTP y avisos)
# Si algún puerto ya está ocupado en tu máquina, cámbialo con una variable de entorno o un archivo .env
# junto a este (por ejemplo P11_PUERTO_SMTP=1026) y apunta la API al puerto nuevo con Correo__Puerto.
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: p11-mailpit
    ports:
      - "${P11_PUERTO_SMTP:-1025}:1025"
      - "${P11_PUERTO_CORREO_WEB:-8025}:8025"
